<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hub Digital | Lopes produtos e serviços</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header class="topo">

<div class="perfil">

<div class="foto">
🚀
</div>

<h1>Lopes produtos e serviços</h1>

<p>
Produtos • Projetos • Afiliados
</p>

</div>

</header>


<section class="busca">

<input
type="text"
id="pesquisa"
placeholder="Pesquisar produtos..."
>

</section>


<section class="destaque">

<div class="card destaque-card">

<span class="tag">
🔥 Destaque
</span>

<h2>
Oferta da Semana
</h2>

<p>

Confira as melhores oportunidades.

</p>

<a
href="#"
class="botao"
>

Ver Oferta

</a>

</div>

</section>



<main id="conteudo">

<section id="categorias">

<h2 class="titulo">

Categorias

</h2>

<div id="listaCategorias">

<!-- JS cria tudo -->

</div>

</section>



<section
id="produtos"
style="display:none"
>

<button
id="voltar"
>

← Voltar

</button>

<h2
id="tituloCategoria"
>

Categoria

</h2>

<div
id="listaProdutos"
>

</div>

</section>

</main>



<footer>

<p>

Hub Digital © 2026

</p>

<p>

Criado por Christian Lopes

</p>

</footer>


<script src="script.js"></script>

</body>

</html>
